[voxai-transport]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- Generic SIP trunk: carrier details from environment/config ----
[carrier-trunk]
type=endpoint
transport=voxai-transport
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=carrier-trunk
outbound_auth=carrier-auth

[carrier-auth]
type=auth
auth_type=userpass
username=REPLACE_ME
password=REPLACE_ME

[carrier-trunk]
type=aor
contact=sip:REPLACE_CARRIER_HOST:5060

[carrier-identify]
type=identify
endpoint=carrier-trunk
match=REPLACE_CARRIER_IP

; ---- Local softphone testing endpoint (extension 1001) for telephony test without paid SIP trunk ----
[1001]
type=endpoint
transport=voxai-transport
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=1001
auth=1001-auth

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=voxai1001

[1001]
type=aor
max_contacts=2

; ---- Plivo SIP trunk for VoxAI voice app ----
[plivo-trunk-endpoint]
type=endpoint
transport=voxai-transport
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=plivo-trunk-aor

[plivo-trunk-aor]
type=aor
max_contacts=2

; India external-SIP endpoint sources from Plivo's current firewall documentation.
; This is distinct from Plivo SIP phone and SIP-trunking source ranges.
[plivo-trunk-identify]
type=identify
endpoint=plivo-trunk-endpoint
match=13.205.159.55/32,15.206.154.163/32,43.204.247.115/32,43.205.14.55/32

; RTP media sources and HTTPS callback sources are separate from SIP identify matching.
; Apply only source-restricted firewall rules for the configured Plivo routing region.
