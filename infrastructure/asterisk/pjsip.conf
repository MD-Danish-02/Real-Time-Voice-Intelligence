[voxai-transport]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- Generic SIP trunk: carrier details from environment/config ----
[carrier-trunk]
type=endpoint
transport=voxai-transport
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=carrier-trunk
outbound_auth=carrier-auth

[carrier-auth]
type=auth
auth_type=userpass
username=REPLACE_ME
password=REPLACE_ME

[carrier-trunk]
type=aor
contact=sip:REPLACE_CARRIER_HOST:5060

[carrier-identify]
type=identify
endpoint=carrier-trunk
match=REPLACE_CARRIER_IP

; ---- Local softphone testing endpoint (extension 1001) for telephony test without paid SIP trunk ----
[1001]
type=endpoint
transport=voxai-transport
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=1001
auth=1001-auth

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=voxai1001

[1001]
type=aor
max_contacts=2

; ---- Plivo SIP trunk for VoxAI voice app ----
[plivo-trunk-endpoint]
type=endpoint
transport=voxai-transport
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=plivo-trunk-aor

[plivo-trunk-aor]
type=aor
max_contacts=2

; Plivo India (Mumbai) region - Official IP ranges from Plivo docs
; SIP Signaling (External SIP endpoints): 13.52.9.4/32, 13.52.9.5/32, 18.214.109.132/32, 18.214.109.133/32
; Zentrunk SIP Trunking (Mumbai): 15.207.90.192/31, 204.89.151.128/27, 204.89.151.160/27
; Combined for identify (source IP matching on incoming INVITE):
[plivo-trunk-identify]
type=identify
endpoint=plivo-trunk-endpoint
match=13.52.9.4/32,13.52.9.5/32,18.214.109.132/32,18.214.109.133/32,15.207.90.192/31,204.89.151.128/27,204.89.151.160/27

; NOTE: RTP media IPs (204.89.151.64/26, 204.89.151.128/25) and Callback IPs (3.7.4.233/32, 3.7.220.174/32)
; are NOT in identify match. They must be allowed in firewall for media path and webhook endpoint respectively.
