; ============================================================
; VoxAI Plivo Dialplan Patch - Append to /etc/asterisk/extensions.conf
; Non-destructive: adds [from-trunk] context for Plivo inbound calls
; ============================================================

[from-trunk]
; Inbound Plivo SIP calls -> VoxAI ARI/Stasis application
; Plivo <Dial><Sip> sends: sip:voxai_voice_app@<asterisk-ip>
; EXTEN will be "voxai_voice_app" (the SIP username)
exten => voxai_voice_app,1,NoOp(Inbound Plivo call to VoxAI: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()

; Fallback for numeric DIDs (E.164, local)
exten => _X.,1,NoOp(Inbound DID call: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()

exten => _+X.,1,NoOp(Inbound E.164 call: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()

; Plivo outbound SIP leg: sip:call_{call_id}@{SIP_PUBLIC_HOST}
exten => _call_.,1,NoOp(Plivo outbound SIP call ${EXTEN})
 same => n,Stasis(voxai_voice_app,plivo_outbound,${EXTEN:5})
 same => n,Hangup()
 same => n,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()