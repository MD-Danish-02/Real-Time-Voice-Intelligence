; ============================================================
; VoxAI Plivo SIP Patch - Append to /etc/asterisk/pjsip.conf
; Non-destructive: adds only missing transport/endpoint/identify
; ============================================================

; ---- UDP Transport for SIP signalling (required: pjsip show transports was empty) ----
[voxai-transport]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- Plivo India (Mumbai) SIP trunk ----
; External SIP endpoints (Plivo Voice API):
;   13.52.9.4/32, 13.52.9.5/32, 18.214.109.132/32, 18.214.109.133/32
; Zentrunk SIP Trunking (Mumbai):
;   15.207.90.192/31, 204.89.151.128/27, 204.89.151.160/27
; RTP media IPs (NOT in identify - firewall only):
;   204.89.151.64/26, 204.89.151.128/25
; Callback IPs (NOT in identify - firewall only):
;   3.7.4.233/32, 3.7.220.174/32

[plivo-trunk-endpoint]
type=endpoint
transport=voxai-transport
context=from-trunk
disallow=all
allow=ulaw,alaw
aors=plivo-trunk-aor
; No auth required for inbound from Plivo (IP-based identify)

[plivo-trunk-aor]
type=aor
max_contacts=2

[plivo-trunk-identify]
type=identify
endpoint=plivo-trunk-endpoint
match=13.52.9.4/32,13.52.9.5/32,18.214.109.132/32,18.214.109.133/32,15.207.90.192/31,204.89.151.128/27,204.89.151.160/27