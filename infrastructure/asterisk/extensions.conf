[from-trunk]
; Inbound PSTN/SIP calls are handed to the voxai ARI (Stasis) application.
; Explicit match for VoxAI SIP username used by Plivo <Dial><Sip>
exten => voxai_voice_app,1,NoOp(Inbound VoxAI SIP call ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()

; Numeric DID patterns (E.164 and local)
exten => _X.,1,NoOp(Inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()

exten => _+X.,1,NoOp(Inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()

; Plivo outbound SIP leg: sip:call_{call_id}@{SIP_PUBLIC_HOST}
exten => _call_.,1,NoOp(Plivo outbound SIP call ${EXTEN})
 same => n,Stasis(voxai_voice_app,plivo_outbound,${EXTEN:5})
 same => n,Hangup()

; Catch-all (preserves existing behavior for unknown extensions)
exten => _.,1,NoOp(Inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()

[outbound-ari]
exten => _X.,1,Stasis(voxai_voice_app,outbound,${EXTEN})
 same => n,Hangup()

exten => _+X.,1,Stasis(voxai_voice_app,outbound,${EXTEN})
 same => n,Hangup()

exten => _.,1,Stasis(voxai_voice_app,outbound,${EXTEN})
 same => n,Hangup()

[from-internal]
; Local softphone extension 1001 routing
exten => 1001,1,NoOp(Softphone direct test call)
 same => n,Stasis(voxai_voice_app,inbound,1001)
 same => n,Hangup()

exten => _X.,1,Stasis(voxai_voice_app,inbound,${EXTEN})
 same => n,Hangup()

